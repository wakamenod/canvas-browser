<!doctype html><html><head><meta charset="utf-8"><title>find shadow fixture</title>
<style>body{font:18px sans-serif;margin:20px}</style></head>
<body>
<h1>Find in a web component</h1>
<p id="first">first apple, in the page</p>
<apple-card></apple-card>
<p id="last">last apple, in the page again</p>
<script>
customElements.define('apple-card', class extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({mode: 'open'}).innerHTML = '<p>apple in a shadow root</p>';
  }
});
</script>
</body></html>
